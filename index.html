<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Học và tra cứu Năng lượng số qua 8 từ trường, 64 cặp số cơ bản và thư viện 143 slide tài liệu Tinh Hoa NLS. Có lộ trình học và ảnh nguồn đối chiếu." />
    <meta name="theme-color" content="#285840" />
    <title>Tinh Hoa Năng Lượng Số · Học và tra cứu</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark') document.documentElement.classList.add('dark')
          else document.documentElement.classList.remove('dark')
        } catch (e) {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
